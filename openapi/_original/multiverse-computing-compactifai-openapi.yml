openapi: 3.1.0
info:
  title: ChatbotAPI
  description: Chatbot API. Provided by Multiverse Computing.
  contact:
    name: Multiverse Computing
    url: https://multiversecomputing.com/
    email: contact@multiversecomputing.com
  version: 0.1.1
paths:
  /v1/audio/transcriptions:
    post:
      tags:
      - audio
      summary: Audio transcriptions endpoint (OpenAI compatible)
      description: OpenAI-compatible POST `/v1/audio/transcriptions`.
      operationId: create_transcription_v1_audio_transcriptions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      - name: x-app-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-App-Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_transcription_v1_audio_transcriptions_post'
      responses:
        '200':
          description: Transcription response in the requested format
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/batches:
    post:
      tags:
      - batches
      summary: Create a batch
      description: 'Create a new batch inference job.


        Accepts OpenAI ``BatchCreateParams`` (input file id, endpoint, completion_window).

        Publishes the job to the file store for async processing and returns a Batch

        object with status ``validating``.


        Parameters:

        - **app_config**: Application configuration.

        - **batch_request**: Batch creation parameters (``input_file_id``, ``endpoint``,
        ``completion_window``).

        - **authorization**: Bearer token for authentication.


        Returns:

        - A Batch object with status ''validating''.'
      operationId: create_batch_v1_batches_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateParams'
      responses:
        '201':
          description: The created batch object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - batches
      summary: List batches
      description: 'List batch jobs (OpenAI-compatible: ``GET /v1/batches`` with ``after``,
        ``limit``, and list envelope).


        Each entry is hydrated like ``GET /batches/{{batch_id}}`` (live status from
        file meta).'
      operationId: get_batches_v1_batches_get
      security:
      - HTTPBearer: []
      parameters:
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'A cursor for pagination: the object id after which to fetch
            the next page. Use the previous response''s last_id to page forward.'
          title: After
        description: 'A cursor for pagination: the object id after which to fetch
          the next page. Use the previous response''s last_id to page forward.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of items to return (1–100, default 20).
          default: 20
          title: Limit
        description: Maximum number of items to return (1–100, default 20).
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      responses:
        '200':
          description: Paginated-style list of batch objects (OpenAI-compatible shape)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/batches/{batch_id}:
    get:
      tags:
      - batches
      summary: Retrieve a batch
      description: 'Return the batch job state by loading the batch JSON stored at
        creation time.


        Parameters:

        - **batch_id**: Identifier returned by ``POST /batches`` (e.g. ``batch_…``).

        - **app_config**: Application configuration.

        - **authorization**: Bearer token for authentication.


        Returns:

        - The persisted :class:`Batch` object (same shape as create), including ``status``.'
      operationId: get_batch_v1_batches__batch_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      responses:
        '200':
          description: The batch object including current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/batches/{batch_id}/cancel:
    post:
      tags:
      - batches
      summary: Cancel a batch
      description: 'Request cancellation of an in-progress batch (OpenAI-compatible
        shape).


        Matches ``POST /v1/batches/{batch_id}/cancel``: returns the updated :class:`Batch`,

        usually with ``status`` ``cancelling`` and ``cancelling_at`` set.


        Parameters:

        - **batch_id**: Batch identifier (e.g. ``batch_…``).

        - **authorization**: Bearer token for authentication.


        Returns:

        - The updated batch object.'
      operationId: cancel_batch_v1_batches__batch_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      responses:
        '200':
          description: The batch object after requesting cancellation (typically status
            cancelling)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/completions:
    post:
      tags:
      - completions
      summary: Chat completions endpoint
      description: 'Generate a chat completion from the model.


        Accepts a ChatCompletionRequest containing the model, message history, and
        optional generation parameters

        like temperature, max_tokens, etc. Returns a ChatCompletionResponse in OpenAI-compatible
        format.


        Parameters:

        - **app_config**: Application configuration

        - **chat_completion_request**: The prompt and parameters for model inference.

        - **authorization**: The authorization credentials.


        Returns:

        - A ChatCompletionResponse containing the assistant''s reply.'
      operationId: chat_completions_v1_chat_completions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      - name: x-app-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-App-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Chat completions response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/files/{file_id}/content:
    get:
      tags:
      - files
      summary: Retrieve file content
      description: Return the raw binary contents of the specified file.
      operationId: get_file_content_v1_files__file_id__content_get
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      responses:
        '200':
          description: Raw binary content of the file
          content:
            application/json:
              schema: {}
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/files:
    post:
      tags:
      - files
      summary: Upload file
      description: 'The file upload API authenticates with the bearer token and uses
        app-level

        file store configuration.'
      operationId: post_files_v1_files_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_post_files_v1_files_post'
      responses:
        '200':
          description: File object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models/{model}:
    get:
      tags:
      - Model info
      summary: Get model information
      operationId: get_model_info_v1_models__model__get
      security:
      - HTTPBearer: []
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
          title: Model
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/models:
    get:
      tags:
      - Model info
      summary: Get model list
      operationId: get_model_info_list_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/completions:
    post:
      tags:
      - completions
      summary: Completions endpoint
      description: 'Generate a completion from the model.


        Accepts a CompletionRequest containing the model, prompt, and optional generation
        parameters

        like temperature, max_tokens, etc. Returns a CompletionResponse in OpenAI-compatible
        format.


        Parameters:

        - **app_config**: Application configuration

        - **completion_request**: The prompt and parameters for model inference.

        - **authorization**: The authorization credentials.


        Returns:

        - A CompletionResponse containing the assistant''s reply.'
      operationId: complete_prompt_v1_completions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      - name: x-app-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-App-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
      responses:
        '200':
          description: Completions response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/responses/{response_id}:
    get:
      tags:
      - responses
      summary: Retrieve response
      description: 'Return a previously stored response, scoped to the authenticated
        user.


        Only responses created with ``store: true`` are available, and only to the

        user who created them.'
      operationId: get_response_v1_responses__response_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: response_id
        in: path
        required: true
        schema:
          type: string
          title: Response Id
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      responses:
        '200':
          description: Stored response payload from /v1/responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/responses:
    post:
      tags:
      - responses
      summary: Create response
      description: 'Generate a response from the model.


        Parameters:

        - **app_config**: Application configuration

        - **body**: ResponsesRequest payload with model and optional response parameters.

        - **authorization**: The authorization credentials.


        Returns:

        - A ResponsesResult for non-streaming requests.

        - A StreamingResponse when stream is true.'
      operationId: post_responses_v1_responses_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-request-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      - name: x-app-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-App-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: Response payload (non-streaming). When stream=true a text/event-stream
            of response events is returned instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActionClick:
      properties:
        button:
          type: string
          enum:
          - left
          - right
          - wheel
          - back
          - forward
          title: Button
        type:
          type: string
          const: click
          title: Type
        x:
          type: integer
          title: X
        y:
          type: integer
          title: Y
      additionalProperties: true
      type: object
      required:
      - button
      - type
      - x
      - y
      title: ActionClick
    ActionDoubleClick:
      properties:
        type:
          type: string
          const: double_click
          title: Type
        x:
          type: integer
          title: X
        y:
          type: integer
          title: Y
      additionalProperties: true
      type: object
      required:
      - type
      - x
      - y
      title: ActionDoubleClick
    ActionDrag:
      properties:
        path:
          items:
            $ref: '#/components/schemas/ActionDragPath'
          type: array
          title: Path
        type:
          type: string
          const: drag
          title: Type
      additionalProperties: true
      type: object
      required:
      - path
      - type
      title: ActionDrag
    ActionDragPath:
      properties:
        x:
          type: integer
          title: X
        y:
          type: integer
          title: Y
      additionalProperties: true
      type: object
      required:
      - x
      - y
      title: ActionDragPath
    ActionFind:
      properties:
        pattern:
          type: string
          title: Pattern
        type:
          type: string
          const: find
          title: Type
        url:
          type: string
          title: Url
      additionalProperties: true
      type: object
      required:
      - pattern
      - type
      - url
      title: ActionFind
    ActionKeypress:
      properties:
        keys:
          items:
            type: string
          type: array
          title: Keys
        type:
          type: string
          const: keypress
          title: Type
      additionalProperties: true
      type: object
      required:
      - keys
      - type
      title: ActionKeypress
    ActionMove:
      properties:
        type:
          type: string
          const: move
          title: Type
        x:
          type: integer
          title: X
        y:
          type: integer
          title: Y
      additionalProperties: true
      type: object
      required:
      - type
      - x
      - y
      title: ActionMove
    ActionOpenPage:
      properties:
        type:
          type: string
          const: open_page
          title: Type
        url:
          type: string
          title: Url
      additionalProperties: true
      type: object
      required:
      - type
      - url
      title: ActionOpenPage
    ActionScreenshot:
      properties:
        type:
          type: string
          const: screenshot
          title: Type
      additionalProperties: true
      type: object
      required:
      - type
      title: ActionScreenshot
    ActionScroll:
      properties:
        scroll_x:
          type: integer
          title: Scroll X
        scroll_y:
          type: integer
          title: Scroll Y
        type:
          type: string
          const: scroll
          title: Type
        x:
          type: integer
          title: X
        y:
          type: integer
          title: Y
      additionalProperties: true
      type: object
      required:
      - scroll_x
      - scroll_y
      - type
      - x
      - y
      title: ActionScroll
    ActionSearch:
      properties:
        query:
          type: string
          title: Query
        type:
          type: string
          const: search
          title: Type
        sources:
          anyOf:
          - items:
              $ref: '#/components/schemas/ActionSearchSource'
            type: array
          - type: 'null'
          title: Sources
      additionalProperties: true
      type: object
      required:
      - query
      - type
      title: ActionSearch
    ActionSearchSource:
      properties:
        type:
          type: string
          const: url
          title: Type
        url:
          type: string
          title: Url
      additionalProperties: true
      type: object
      required:
      - type
      - url
      title: ActionSearchSource
    ActionType:
      properties:
        text:
          type: string
          title: Text
        type:
          type: string
          const: type
          title: Type
      additionalProperties: true
      type: object
      required:
      - text
      - type
      title: ActionType
    ActionWait:
      properties:
        type:
          type: string
          const: wait
          title: Type
      additionalProperties: true
      type: object
      required:
      - type
      title: ActionWait
    AnnotationContainerFileCitation:
      properties:
        container_id:
          type: string
          title: Container Id
        end_index:
          type: integer
          title: End Index
        file_id:
          type: string
          title: File Id
        filename:
          type: string
          title: Filename
        start_index:
          type: integer
          title: Start Index
        type:
          type: string
          const: container_file_citation
          title: Type
      additionalProperties: true
      type: object
      required:
      - container_id
      - end_index
      - file_id
      - filename
      - start_index
      - type
      title: AnnotationContainerFileCitation
    AnnotationFileCitation:
      properties:
        file_id:
          type: string
          title: File Id
        filename:
          type: string
          title: Filename
        index:
          type: integer
          title: Index
        type:
          type: string
          const: file_citation
          title: Type
      additionalProperties: true
      type: object
      required:
      - file_id
      - filename
      - index
      - type
      title: AnnotationFileCitation
    AnnotationFilePath:
      properties:
        file_id:
          type: string
          title: File Id
        index:
          type: integer
          title: Index
        type:
          type: string
          const: file_path
          title: Type
      additionalProperties: true
      type: object
      required:
      - file_id
      - index
      - type
      title: AnnotationFilePath
    AnnotationURLCitation:
      properties:
        end_index:
          type: integer
          title: End Index
        start_index:
          type: integer
          title: Start Index
        title:
          type: string
          title: Title
        type:
          type: string
          const: url_citation
          title: Type
        url:
          type: string
          title: Url
      additionalProperties: true
      type: object
      required:
      - end_index
      - start_index
      - title
      - type
      - url
      title: AnnotationURLCitation
    Audio:
      properties:
        id:
          type: string
          title: Id
      type: object
      required:
      - id
      title: Audio
    Batch:
      properties:
        id:
          type: string
          title: Id
        completion_window:
          type: string
          title: Completion Window
        created_at:
          type: integer
          title: Created At
        endpoint:
          type: string
          title: Endpoint
        input_file_id:
          type: string
          title: Input File Id
        object:
          type: string
          const: batch
          title: Object
        status:
          type: string
          enum:
          - validating
          - failed
          - in_progress
          - finalizing
          - completed
          - expired
          - cancelling
          - cancelled
          title: Status
        cancelled_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cancelled At
        cancelling_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cancelling At
        completed_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Completed At
        error_file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Error File Id
        errors:
          anyOf:
          - $ref: '#/components/schemas/Errors'
          - type: 'null'
        expired_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expired At
        expires_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires At
        failed_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Failed At
        finalizing_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Finalizing At
        in_progress_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: In Progress At
        metadata:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Metadata
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        output_file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Output File Id
        request_counts:
          anyOf:
          - $ref: '#/components/schemas/BatchRequestCounts'
          - type: 'null'
        usage:
          anyOf:
          - $ref: '#/components/schemas/BatchUsage'
          - type: 'null'
      additionalProperties: true
      type: object
      required:
      - id
      - completion_window
      - created_at
      - endpoint
      - input_file_id
      - object
      - status
      title: Batch
    BatchCreateParams:
      properties:
        completion_window:
          type: string
          const: 24h
          title: Completion Window
        endpoint:
          type: string
          enum:
          - /v1/responses
          - /v1/chat/completions
          - /v1/embeddings
          - /v1/completions
          title: Endpoint
        input_file_id:
          type: string
          title: Input File Id
        metadata:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Metadata
        output_expires_after:
          $ref: '#/components/schemas/OutputExpiresAfter'
      type: object
      required:
      - completion_window
      - endpoint
      - input_file_id
      title: BatchCreateParams
    BatchError:
      properties:
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
        line:
          anyOf:
          - type: integer
          - type: 'null'
