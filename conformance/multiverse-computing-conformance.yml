domain_standard:
  market: LLM inference / model-serving APIs
  standard: OpenAI API compatibility (de-facto interoperability standard for LLM inference
    endpoints)
  declared: true
  conforms: true
  evidence:
  - location: openapi/multiverse-computing-compactifai-openapi.yml paths
    detail: 'The contract implements the OpenAI request/response surface verbatim under
      /v1: /v1/chat/completions, /v1/completions, /v1/responses, /v1/responses/{id},
      /v1/batches (+ list, retrieve, cancel), /v1/files, /v1/files/{id}/content,
      /v1/models, /v1/models/{model}, /v1/audio/transcriptions.'
  - location: openapi operation descriptions
    detail: 'The spec states the compatibility in its own text: "OpenAI-compatible POST
      `/v1/audio/transcriptions`", "Accepts OpenAI ``BatchCreateParams``", "List batch jobs
      (OpenAI-compatible: ``GET /v1/batches`` with ``after``, ``limit``, and list
      envelope)", "Returns a ChatCompletionResponse in OpenAI-compatible format",
      "Matches ``POST /v1/batches/{batch_id}/cancel``".'
  - location: openapi components.schemas
    detail: 'Component names are the OpenAI type names — ChatCompletionRequest,
      ChatCompletionAssistantMessageParam, ChatCompletionContentPartImageParam,
      ResponseOutputMessage, ResponseFunctionToolCall, BatchCreateParams, BatchList,
      FileObject, CompletionUsage — including two schemas whose keys are the literal OpenAI
      Python module paths (openai__types__responses__web_search_tool__UserLocation).'
  - location: https://docs.compactif.ai/openai-compatibility/
    detail: A dedicated documentation page for OpenAI compatibility, linking to
      platform.openai.com API reference pages and to the openai-python and openai-node
      SDKs as the recommended clients.
  buyer_impact: 'A team already calling OpenAI integrates by changing base_url and the
    model ID; no bespoke connector is needed. This is the whole commercial premise of the
    product.'
  caveats:
  - 'Compatibility is a surface claim, not a version claim: no OpenAI API version or dated
    schema revision is named, so drift is unmanaged on both sides.'
  - 'Parameter coverage diverges. ChatCompletionRequest omits `seed` and `logprobs` and
    adds three non-OpenAI parameters — `min_tokens`, `ignore_eos`, `reasoning_enabled` —
    so a strict OpenAI client will not exercise the whole surface and a CompactifAI-tuned
    client is not portable back.'
  - 'The FAQ note that streaming, tools and response_format are supported is documentation,
    not contract: the spec does not mark which models honour which parameter, while the
    changelog shows tool calling arriving model-by-model.'
notes:
- 'REWARD-ONLY reading: LLM inference has no formal SDO standard. OpenAI API compatibility
  is the de-facto one, it is declared inside the contract rather than only on a marketing
  page, and it is implemented across the whole 13-operation surface.'
