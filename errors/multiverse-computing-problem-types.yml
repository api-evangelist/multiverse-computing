gaps:
- '429 is not documented and is not declared in the OpenAPI. No Retry-After or
  RateLimit-* header is returned. An agent cannot distinguish throttling from any other
  failure.'
- '`code` and `param` are documented as always null, so the only machine-actionable field
  in the envelope is `type`, which has 4 documented values.'
- The docs and the spec disagree about body-validation failures — docs say 400, the
  OpenAPI declares 422 on 12 operations.
- No error is documented for the batch, files or responses surfaces beyond the generic
  422/404.
