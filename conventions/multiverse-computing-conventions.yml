reversibility:
  grade: documented
  applicable: true
  summary: 'One real reversal path exists — batch cancellation — and no window is stated
    for it. Every other write on this API is an inference call that is billed at the moment
    it is made and cannot be taken back.'
  surfaces:
  - operation: create_batch_v1_batches_post
    method: POST
    path: /v1/batches
    reversal:
      exists: true
      operation: cancel_batch_v1_batches__batch_id__cancel_post
      method: POST
      path: /v1/batches/{batch_id}/cancel
      semantics: 'Requests cancellation of an in-progress batch; returns the updated Batch,
        usually with status "cancelling" and cancelling_at set. The Batch object also
        carries cancelled_at, so the terminal cancelled state is observable.'
    window:
      stated: false
      value: null
      evidence: 'The spec says cancellation applies to an "in-progress" batch, which bounds
        it by job state rather than by time. Neither docs.compactif.ai nor the OpenAPI
        states how long cancellation remains possible, how long the batch sits in
        "cancelling", or whether already-completed requests inside the batch are still
        billed. BatchCreateParams.completion_window and Batch.expires_at exist but describe
        when the job must FINISH, not how long it can be cancelled.'
      source: openapi/multiverse-computing-compactifai-openapi.yml
    grade: documented
  - operation: post_files_v1_files_post
    method: POST
    path: /v1/files
    reversal:
      exists: false
      note: 'There is no DELETE /v1/files/{file_id}. The API can upload a file and read it
        back, but publishes no way to remove one. OutputExpiresAfter /
        BatchCreateParams.output_expires_after governs expiry of batch OUTPUT files only.'
    window:
      stated: false
    grade: none
  - operation: chat_completions_v1_chat_completions_post
    method: POST
    path: /v1/chat/completions
    reversal:
      exists: false
      note: Inference is executed and metered on receipt. No void, no refund, no credit
        path is published.
    grade: none
  - operation: complete_prompt_v1_completions_post
    method: POST
    path: /v1/completions
    reversal:
      exists: false
    grade: none
  - operation: post_responses_v1_responses_post
    method: POST
    path: /v1/responses
    reversal:
      exists: false
      note: 'Responses created with store:true are retrievable via
        GET /v1/responses/{response_id} but there is no delete operation, so a stored
        response cannot be withdrawn through the API.'
    grade: none
  - operation: create_transcription_v1_audio_transcriptions_post
    method: POST
    path: /v1/audio/transcriptions
    reversal:
      exists: false
    grade: none
  mitigating_context:
  - 'Zero Data Retention is the provider''s stated default: prompts and completions are
    never stored, so "undo" for an inference call is largely moot on the privacy axis —
    but not on the billing axis, since token usage is metered and invoiced monthly.
    Source: https://docs.compactif.ai/data-privacy/'
  agent_guidance: 'Before firing a batch, confirm the caller accepts that cancellation is
    best-effort with no stated window and no stated billing consequence. Treat every
    completion call as irreversible and billed.'
