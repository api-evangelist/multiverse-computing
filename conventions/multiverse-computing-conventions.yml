idempotency:
  supported: false
  header: null
  scope: null
  retention: null
  evidence:
  - No Idempotency-Key (or equivalent) header appears anywhere in the 13-operation OpenAPI.
  - The string "idempoten" does not occur in the OpenAPI document or in any page of
    docs.compactif.ai.
  mitigations:
  - name: seed
    available: false
    note: 'Unlike OpenAI''s chat completions, ChatCompletionRequest here declares no `seed`
      parameter, so even deterministic-sampling replay is unavailable.'
  - name: client-supplied correlation id
    available: true
    header: x-request-id
    note: 'x-request-id is an optional REQUEST header on 11 of the 13 operations, so a
      client can supply its own correlation value — but nothing in the contract says the
      server deduplicates on it. It is a tracing identifier, not an idempotency key.'
  consequence: 'A retried POST /v1/chat/completions, /v1/completions, /v1/responses or
    /v1/batches is billed and executed again. For an agent, the safe posture is
    at-most-once: do not blind-retry a write, reconcile with GET /v1/batches or
    GET /v1/responses/{response_id} first.'
pagination:
  supported: true
  style: cursor
  operations:
