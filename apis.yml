aid: multiverse-computing
name: Multiverse Computing
description: Multiverse Computing, S.L. is a Donostia-San Sebastian (Spain) quantum- and AI-software company
  whose commercial developer surface is the CompactifAI API — an OpenAI-compatible LLM inference service
  serving tensor-network-compressed versions of frontier open models (Hypernova 60B, Carina 60B, Mistral
  Small 3.1 Slim, Whisper Large V3 Turbo Slim) alongside uncompressed third-party models (GPT-OSS 120B,
  GLM 5.1/5.2, Quasar 438B, Qwen 3.6 27B, Nemotron 3 Nano Omni). The API is published at api.compactif.ai
  with regional EU and US endpoints, documented at docs.compactif.ai, billed pay-as-you-go per million
  tokens, and also sold through the AWS Marketplace. The company additionally sells Singularity, a quantum
  and quantum-inspired optimization product for finance, energy and manufacturing, which has no public
  developer documentation.
