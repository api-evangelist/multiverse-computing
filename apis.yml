apis:
- aid: multiverse-computing-compactifai-api
  name: CompactifAI API
  description: OpenAI-compatible inference API for CompactifAI's compressed and third-party large language
    models. Covers chat completions, text completions, the Responses API, batch jobs, file upload, model
    discovery and Whisper audio transcription. Authenticated with a Bearer API key issued from the CompactifAI
    Dashboard or via AWS Marketplace subscription.
